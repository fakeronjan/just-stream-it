name: Update Just Stream It data

on:
  schedule:
    - cron: '0 12 * * *'   # 12:00 UTC daily
  workflow_dispatch:        # allow manual trigger from GitHub UI

permissions:
  contents: write           # needed for git push

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate web data
        working-directory: scripts
        env:
          ESPN_S2: ${{ secrets.ESPN_S2 }}
          ESPN_SWID: ${{ secrets.ESPN_SWID }}
        run: python generate_data.py

      - name: Build keeper guide
        working-directory: scripts
        env:
          ESPN_S2: ${{ secrets.ESPN_S2 }}
          ESPN_SWID: ${{ secrets.ESPN_SWID }}
        run: python build_keeper_guide.py

      # In-season stats behind the Weekly News "Season to Date" section
      # (and the recap engine): box scores + transactions + team analytics,
      # NFL scores, season moments, weekly recap. All four only look at
      # weeks with real results, so running daily mid-week is safe.
      - name: Build season analytics
        working-directory: scripts
        env:
          ESPN_S2: ${{ secrets.ESPN_S2 }}
          ESPN_SWID: ${{ secrets.ESPN_SWID }}
        run: python build_season_analytics.py 2026

      - name: Fetch NFL schedule
        working-directory: scripts
        run: python fetch_nfl_schedule.py 2026

      - name: Build season moments and weekly recap
        working-directory: scripts
        run: |
          python build_season_moments.py 2026
          python build_weekly_recap.py 2026

      - name: Commit and push updated data
        run: |
          git config user.name  "Just Stream It Bot"
          git config user.email "just-stream-it-bot@users.noreply.github.com"
          git add -A docs/data/ docs/logos/
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Update league data $(date -u '+%Y-%m-%d')"
            pushed=0
            for i in 1 2 3; do
              git pull --rebase origin main && git push && { pushed=1; break; }
              echo "Push attempt $i failed; retrying in 5s..."
              sleep 5
            done
            if [ "$pushed" -ne 1 ]; then
              echo "::error::Failed to push updated data after 3 attempts."
              exit 1
            fi
          fi
