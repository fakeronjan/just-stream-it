<!--
  UNLISTED preview - not linked from nav.js or any other page on purpose.
  Testing the newspaper visual treatment + build_weekly_recap.py's real
  output against the full 2025 season before this becomes season-2026.html
  for real. Reachable only by direct URL.
-->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Just Stream It - 2025 Recap Preview (unlisted)</title>
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rozha+One&family=Vollkorn:ital,wght@0,400;0,600;0,700;1,400&family=Special+Elite&display=swap" rel="stylesheet">
<script src="nav.js"></script>
<style>
  :root {
    --paper:      #ddd7c8;
    --paper-2:    #d3ccba;
    --ink:        #1c1a16;
    --ink-dim:    #4a463c;
    --meta:       #8a8571;
    --rule:       #1c1a16;
    --red:        #a3241c;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--paper);
    background-image:
      repeating-linear-gradient(0deg, rgba(0,0,0,0.015) 0px, transparent 1px, transparent 2px),
      repeating-linear-gradient(90deg, rgba(0,0,0,0.012) 0px, transparent 1px, transparent 2px);
    color: var(--ink);
    font-family: "Vollkorn", Georgia, "Times New Roman", serif;
    line-height: 1.55;
  }

  a { color: var(--red); }

  .page { max-width: 760px; margin: 0 auto; padding: 0 20px 80px; }

  /* ---------- lock screen ---------- */
  #lock-screen { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
  .lock-box {
    width: 100%; max-width: 420px;
    background: var(--paper-2);
    border: 1px solid var(--ink);
    padding: 32px 28px;
    text-align: center;
  }
  .lock-box img.logo { width: 64px; height: 64px; border-radius: 10px; margin-bottom: 12px; }
  .lock-title { font-family: "Rozha One", serif; font-size: 1.6rem; margin: 0 0 6px; }
  .lock-box p { color: var(--ink-dim); font-size: 0.9rem; margin: 0 0 16px; }
  .prompt-line { display: flex; align-items: center; gap: 8px; border: 1px solid var(--ink); background: #fff8; padding: 8px 10px; }
  .prompt-line .dollar { font-family: "Special Elite", monospace; color: var(--red); }
  .prompt-line input {
    flex: 1; border: none; background: transparent; outline: none;
    font-family: "Special Elite", monospace; font-size: 0.95rem; color: var(--ink);
  }
  .lock-error { color: var(--red); font-size: 0.82rem; margin-top: 10px; visibility: hidden; }
  .lock-error.show { visibility: visible; }

  /* ---------- masthead ---------- */
  header.masthead { padding-top: 28px; text-align: center; }
  .masthead-meta {
    font-family: "Special Elite", monospace;
    font-size: 0.68rem;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--ink-dim);
    display: flex;
    justify-content: space-between;
    border-bottom: 1px solid var(--ink);
    padding-bottom: 6px;
    margin-bottom: 10px;
  }
  h1.nameplate {
    font-family: "Rozha One", serif;
    font-size: clamp(2.1rem, 9.5vw, 3.6rem);
    margin: 0;
    letter-spacing: 0.005em;
    line-height: 1.05;
  }
  .tagline {
    font-family: "Special Elite", monospace;
    font-size: 0.72rem;
    letter-spacing: 0.05em;
    color: var(--ink-dim);
    margin: 4px 0 0;
  }
  .masthead-rule {
    border: 0; border-top: 3px solid var(--ink); border-bottom: 1px solid var(--ink);
    height: 4px; margin: 14px 0 6px;
  }

  nav.resources {
    display: flex;
    flex-wrap: nowrap;
    gap: 4px 14px;
    overflow-x: auto;
    -webkit-overflow-scrolling: touch;
    scrollbar-width: none;
    justify-content: flex-start;
    font-family: "Special Elite", monospace;
    font-size: 0.72rem;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    padding: 8px 0 18px;
  }
  nav.resources::-webkit-scrollbar { display: none; }
  nav.resources a { flex: 0 0 auto; white-space: nowrap; color: var(--ink-dim); text-decoration: none; }
  nav.resources a:hover { color: var(--red); }
  nav.resources a.active { color: var(--red); font-weight: 700; }
  nav.resources .nav-arrow { font-size: 0.9em; margin-left: 0.1em; }
  nav.resources .nav-sep { color: var(--meta); }

  /* ---------- editions ---------- */
  .edition { margin-top: 40px; }
  .edition + .edition { border-top: 3px double var(--ink); padding-top: 32px; }

  .kicker {
    font-family: "Special Elite", monospace;
    font-size: 0.72rem;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--red);
    margin: 0 0 4px;
  }
  h2.edition-head {
    font-family: "Rozha One", serif;
    font-size: 2rem;
    margin: 0 0 4px;
    text-wrap: balance;
  }
  .dateline {
    font-family: "Special Elite", monospace;
    font-size: 0.7rem;
    color: var(--meta);
    text-transform: uppercase;
    letter-spacing: 0.05em;
    margin: 0 0 18px;
  }

  .crest { flex: 0 0 auto; display: flex; }
  .crest img {
    width: 26px; height: 26px; border-radius: 4px; object-fit: cover;
    border: 1px solid var(--ink);
    filter: grayscale(1) contrast(1.05) brightness(0.95) sepia(0.15);
  }
  .crest img + img { margin-left: -8px; }

  /* ---------- features: the actual story, front-and-center ---------- */
  .feature {
    display: flex;
    gap: 14px;
    align-items: flex-start;
    padding: 16px 0;
    border-bottom: 1px solid var(--ink);
  }
  .feature .crest img { width: 34px; height: 34px; }
  .feature-label {
    font-family: "Special Elite", monospace;
    font-size: 0.68rem;
    letter-spacing: 0.07em;
    text-transform: uppercase;
    color: var(--red);
    margin: 0 0 4px;
  }
  .feature-text {
    font-family: "Rozha One", serif;
    font-size: 1.15rem;
    line-height: 1.32;
    margin: 0;
    text-wrap: balance;
  }

  /* ---------- lineup breakdown (Game of the Week only) ---------- */
  .lineups {
    display: flex;
    gap: 18px;
    margin-top: 12px;
    flex-wrap: wrap;
  }
  .lineup-col { flex: 1; min-width: 220px; }
  .lineup-team {
    display: flex;
    align-items: center;
    gap: 6px;
    font-family: "Special Elite", monospace;
    font-size: 0.68rem;
    text-transform: uppercase;
    letter-spacing: 0.03em;
    color: var(--ink-dim);
    margin: 0 0 4px;
    border-bottom: 1px solid var(--ink);
    padding-bottom: 3px;
  }
  .lineup-team .crest img { width: 14px; height: 14px; }
  .lineup-row {
    display: flex;
    gap: 8px;
    font-size: 0.78rem;
    padding: 2px 0;
  }
  .lineup-pos { width: 2.6em; flex: 0 0 auto; color: var(--ink-dim); }
  .lineup-name { flex: 1; }
  .lineup-pts { font-variant-numeric: tabular-nums; width: 2.6em; text-align: right; }
  .lineup-total { border-top: 1px solid var(--ink); margin-top: 3px; padding-top: 4px; font-weight: 700; }

  /* ---------- briefs: the box score, compact and plain ---------- */
  .briefs-label {
    font-family: "Special Elite", monospace;
    font-size: 0.68rem;
    letter-spacing: 0.07em;
    text-transform: uppercase;
    color: var(--ink-dim);
    margin: 26px 0 4px;
  }
  .brief {
    display: flex;
    gap: 10px;
    align-items: center;
    padding: 7px 0;
    border-bottom: 1px solid rgba(28,26,22,0.15);
    font-size: 0.85rem;
    color: var(--ink-dim);
  }
  .brief:last-child { border-bottom: none; }
  .brief .crest img { width: 20px; height: 20px; }
  .brief p { margin: 0; }

  /* ---------- playoff picture ---------- */
  .standings {
    margin-top: 22px;
    padding: 16px;
    border: 1px solid var(--ink);
  }
  .standings-label {
    font-family: "Rozha One", serif;
    font-size: 1.05rem;
    margin: 0 0 2px;
  }
  .standings-sublabel {
    font-family: "Special Elite", monospace;
    font-size: 0.65rem;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    color: var(--ink-dim);
    margin: 0 0 10px;
  }
  .standings-row {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 4px 0;
    font-size: 0.85rem;
  }
  .standings-row .crest img { width: 18px; height: 18px; }
  .standings-rank {
    font-family: "Special Elite", monospace;
    width: 1.4em;
    flex: 0 0 auto;
    color: var(--ink-dim);
  }
  .standings-name { flex: 1; }
  .standings-tag {
    font-family: "Special Elite", monospace;
    font-size: 0.6rem;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    padding: 1px 5px;
    border: 1px solid currentColor;
  }
  .standings-tag-clinched { color: var(--ink); }
  .standings-tag-eliminated { color: var(--ink-dim); border-style: dashed; }
  .standings-magic {
    font-family: "Special Elite", monospace;
    font-size: 0.62rem;
    letter-spacing: 0.03em;
    color: var(--red);
  }
  .standings-points {
    font-variant-numeric: tabular-nums;
    color: var(--ink-dim);
    font-size: 0.8rem;
  }
  .standings-points em { color: var(--red); font-style: normal; }
  .standings-record { font-variant-numeric: tabular-nums; width: 3.2em; text-align: right; }
  .standings-out { opacity: 0.55; }
  .standings-cutline { border-top: 2px dashed var(--red); margin: 4px 0; }

  /* ---------- looking ahead ---------- */
  .looking-ahead {
    margin-top: 22px;
    padding: 16px;
    background: var(--paper-2);
    border: 1px solid var(--ink);
  }
  .looking-ahead-label {
    font-family: "Rozha One", serif;
    font-size: 1.05rem;
    margin: 0 0 10px;
  }
  .ahead-line {
    display: flex;
    gap: 10px;
    align-items: center;
    padding: 5px 0;
    font-size: 0.85rem;
  }
  .ahead-line .crest img { width: 20px; height: 20px; }
  .ahead-line p { margin: 0; }

  .empty-state { text-align: center; padding: 60px 20px; color: var(--ink-dim); font-family: "Special Elite", monospace; }

  footer.masthead-footer {
    margin-top: 50px; padding-top: 14px; border-top: 1px solid var(--ink);
    text-align: center; font-family: "Special Elite", monospace; font-size: 0.65rem;
    color: var(--meta); text-transform: uppercase; letter-spacing: 0.05em;
  }
</style>
</head>
<body>

<div id="lock-screen">
  <div class="lock-box">
    <img class="logo" src="logos/just-stream-it-logo.png" alt="">
    <p class="lock-title">Subscribers Only</p>
    <p>Enter the passphrase to read today's edition.</p>
    <form id="auth-form" class="prompt-line">
      <span class="dollar">&gt;</span>
      <input type="text" id="auth-input" autocomplete="off" autofocus>
    </form>
    <p class="lock-error" id="auth-error">Wrong passphrase - try again.</p>
  </div>
</div>

<div id="app" style="display:none" class="page">

  <header class="masthead">
    <div class="masthead-meta">
      <span>Est. 2025</span>
      <span>Unlisted Preview Edition</span>
      <span>Price: One Waiver Claim</span>
    </div>
    <h1 class="nameplate">The Just Stream It<br>Gazette</h1>
    <p class="tagline">&ldquo;All the Fantasy That's Fit to Print&rdquo;</p>
    <hr class="masthead-rule">
    <nav class="resources" id="resources-nav"></nav>
  </header>

  <div id="editions"></div>

  <footer class="masthead-footer">2025 Season, Complete Run &middot; Generated by build_weekly_recap.py</footer>

</div>

<script>
const PASSWORD = 'cockroach';

function teamLogo(t) { return (t && t.logo) || ''; }
function teamName(t) { return (t && t.name && t.name.trim()) || ''; }

function renderClinchTag(row) {
  if (row.status === 'clinched') return ' <span class="standings-tag standings-tag-clinched">clinched</span>';
  if (row.status === 'eliminated') return ' <span class="standings-tag standings-tag-eliminated">eliminated</span>';
  if (row.magic_number !== null) return ` <span class="standings-magic">needs ${row.magic_number}W</span>`;
  return '';
}

function crestImg(t) {
  return `<img src="${teamLogo(t)}" alt="" onerror="this.style.visibility='hidden'">`;
}

function renderCrest(teams, teamId) {
  return `<span class="crest">${crestImg(teams[teamId])}</span>`;
}

function renderCrests(teams, teamId1, teamId2) {
  return `<span class="crest">${crestImg(teams[teamId1])}${crestImg(teams[teamId2])}</span>`;
}

const FEATURE_LABELS = {
  game_of_the_week: 'Game of the Week',
  blowout_of_the_week: 'Blowout of the Week',
  stud_of_the_week: 'Stud of the Week',
  upset_alert: 'Upset Alert',
  division_rival_salt: 'Rival Watch',
  plot_twist: 'Plot Twist',
};

function renderLineupCol(teams, teamId, lineup) {
  const total = lineup.reduce((sum, p) => sum + p.points, 0);
  return `
    <div class="lineup-col">
      <p class="lineup-team">${renderCrest(teams, teamId)} ${teamName(teams[teamId])}</p>
      ${lineup.map(p => `
        <div class="lineup-row">
          <span class="lineup-pos">${p.position}</span>
          <span class="lineup-name">${p.name}</span>
          <span class="lineup-pts">${p.points.toFixed(1)}</span>
        </div>
      `).join('')}
      <div class="lineup-row lineup-total">
        <span class="lineup-pos"></span>
        <span class="lineup-name">Total</span>
        <span class="lineup-pts">${total.toFixed(1)}</span>
      </div>
    </div>
  `;
}

function renderFeature(teams, f) {
  const crests = f.team_ids.length >= 2
    ? renderCrests(teams, f.team_ids[0], f.team_ids[1])
    : renderCrest(teams, f.team_ids[0]);

  const lineupsHtml = f.lineups ? `
    <div class="lineups">
      ${f.team_ids.map(tid => renderLineupCol(teams, tid, f.lineups[String(tid)])).join('')}
    </div>
  ` : '';

  return `
    <article class="feature">
      ${crests}
      <div style="flex:1">
        <p class="feature-label">${FEATURE_LABELS[f.type] || f.type}</p>
        <p class="feature-text">${f.text}</p>
        ${lineupsHtml}
      </div>
    </article>
  `;
}

async function loadApp() {
  document.getElementById('lock-screen').style.display = 'none';
  document.getElementById('app').style.display = '';

  const meta = await (await fetch('data/meta.json')).json();
  document.getElementById('resources-nav').innerHTML = renderNav('recap-preview', meta.league_id);

  const [weeklyRecap, teamsList] = await Promise.all([
    fetch('data/2025/weekly_recap.json').then(r => r.json()),
    fetch('data/2025/teams.json').then(r => r.json()),
  ]);
  const teams = {};
  teamsList.forEach(t => { teams[t.id] = t; });

  const editionsEl = document.getElementById('editions');
  if (!weeklyRecap.length) {
    editionsEl.innerHTML = '<div class="empty-state">No editions yet.</div>';
    return;
  }

  // Newest week first.
  const weeksDesc = [...weeklyRecap].sort((a, b) => b.week - a.week);

  editionsEl.innerHTML = weeksDesc.map(w => {
    const featuresHtml = w.features.map(f => renderFeature(teams, f)).join('');

    const briefsHtml = w.briefs.map(b => `
      <div class="brief">
        ${renderCrests(teams, b.winner_team_id, b.loser_team_id)}
        <p>${b.text}.</p>
      </div>
    `).join('');

    const playoffHtml = `
      <div class="standings">
        <p class="standings-label">Playoff Picture &middot; Through Week ${w.week}</p>
        <p class="standings-sublabel">Top 6 make it &middot; ties broken by points scored</p>
        ${w.playoff_picture.map(row => `
          <div class="standings-row ${row.in_playoffs ? '' : 'standings-out'}">
            <span class="standings-rank">${row.rank}</span>
            ${renderCrest(teams, row.team_id)}
            <span class="standings-name">${teamName(teams[row.team_id])}${renderClinchTag(row)}</span>
            <span class="standings-points">${row.points_for.toFixed(1)} pts${row.points_back !== null ? ` <em>(-${row.points_back.toFixed(1)})</em>` : ''}</span>
            <span class="standings-record">${row.wins}-${row.losses}</span>
          </div>
          ${row.rank === 6 ? '<div class="standings-cutline"></div>' : ''}
        `).join('')}
      </div>
    `;

    const aheadHtml = w.looking_ahead ? `
      <div class="looking-ahead">
        <p class="looking-ahead-label">Looking Ahead &middot; Week ${w.looking_ahead.week}</p>
        ${w.looking_ahead.matchups.map(p => `
          <div class="ahead-line">
            ${renderCrests(teams, p.team_ids[0], p.team_ids[1])}
            <p>${p.text}.</p>
          </div>
        `).join('')}
      </div>
    ` : '';

    return `
      <section class="edition">
        <p class="kicker">Week ${w.week} Edition</p>
        <h2 class="edition-head">This Week Around the League</h2>
        <p class="dateline">2025 Regular Season &middot; Week ${w.week} of 14</p>

        ${featuresHtml}

        <p class="briefs-label">Around the League</p>
        ${briefsHtml}

        ${playoffHtml}

        ${aheadHtml}
      </section>
    `;
  }).join('');
}

document.getElementById('auth-form').addEventListener('submit', (e) => {
  e.preventDefault();
  const input = document.getElementById('auth-input');
  if (input.value === PASSWORD) {
    localStorage.setItem('jsi_auth', 'granted');
    loadApp();
  } else {
    document.getElementById('auth-error').classList.add('show');
    input.value = '';
  }
});

if (localStorage.getItem('jsi_auth') === 'granted') {
  loadApp();
}
</script>

</body>
</html>
