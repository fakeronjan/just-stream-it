<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Just Stream It - 2025 Season Recap</title>
<meta name="description" content="2025 season highlight reel for the Just Stream It fantasy football league - the champion's run, the season's ebbs and flows, top performances, and superlatives.">
<link rel="stylesheet" href="theme.css">
<script>
(function() {
  var saved = localStorage.getItem('jsi_theme');
  var light = saved ? saved === 'light' : (window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches);
  if (light) document.documentElement.setAttribute('data-theme', 'light');
})();
</script>
</head>
<body>

<button class="theme-toggle" id="theme-toggle" type="button" aria-label="Toggle light/dark mode"></button>

<div id="lock-screen">
  <div class="lock-box">
    <img class="logo" src="logos/just-stream-it-logo.png" alt="">
    <p class="lock-title">Just Stream It</p>
    <p>League members only. Enter the passphrase to continue:</p>
    <form id="auth-form" class="prompt-line">
      <span class="dollar">$</span>
      <input type="text" id="auth-input" autocomplete="off" autofocus>
    </form>
    <p class="lock-error" id="auth-error">Wrong passphrase - try again.</p>
  </div>
</div>

<div id="app" style="display:none" class="page">

  <header class="site-header">
    <img class="logo" src="logos/just-stream-it-logo.png" alt="Just Stream It">
    <div>
      <div class="tag">2025 Recap</div>
      <h1>Season in Review</h1>
      <nav class="resources" id="resources-nav"></nav>
    </div>
  </header>

  <div id="content">
    <div class="empty-state">Loading the 2025 season...</div>
  </div>

</div>

<script>
const PASSWORD = 'cockroach';
const SEASON = 2025;

function teamLogo(t) { return t.logo || ''; }
function ownerName(t) { return (t.owners || []).join(' & '); }
function fmt1(v) { return v.toFixed(1); }
function ppgHtml(ppg, total, unit) { return `${fmt1(ppg)}${unit ? ' ' + unit : ''} <span class="stat-sub">(${fmt1(total)} total)</span>`; }

/* Logo + name + manager - the standard way a team is referenced anywhere
   on this page (headlines, lists, chart legend, path steps, tiles), so a
   team name is never shown bare without who runs it. */
/* nameSuffix/ownerSuffix ride inline in the same text line as the name or
   owner (e.g. a seed marker, a "Week N" note) - NOT as a separate flex
   sibling next to the whole two-line chip, which vertically centers
   against the full chip height and lands next to the wrong line the
   moment a team name wraps to two lines. */
function teamChip(team, size, nameSuffix, ownerSuffix) {
  const cls = size ? `team-chip team-chip-${size}` : 'team-chip';
  return `<span class="${cls}"><img class="chip-logo" src="${teamLogo(team)}" alt=""><span class="chip-text"><span class="chip-name">${team.name}${nameSuffix ? ' ' + nameSuffix : ''}</span><span class="chip-owner">${ownerName(team)}${ownerSuffix ? ' ' + ownerSuffix : ''}</span></span></span>`;
}

function matchupHtml(teamA, teamB, connector) {
  return `
    <div class="matchup-block">
      ${teamChip(teamA, 'sm')}
      <div class="matchup-connector">${connector}</div>
      ${teamChip(teamB, 'sm')}
    </div>
  `;
}

/* ---------- derived data ---------- */

function computeRegularSeasonStats(matchups) {
  const points = {}, games = {};
  matchups.forEach(m => {
    if (m.is_playoffs) return;
    points[m.home_team_id] = (points[m.home_team_id] || 0) + m.home_score;
    points[m.away_team_id] = (points[m.away_team_id] || 0) + m.away_score;
    games[m.home_team_id] = (games[m.home_team_id] || 0) + 1;
    games[m.away_team_id] = (games[m.away_team_id] || 0) + 1;
  });
  const out = {};
  Object.keys(points).forEach(id => {
    out[id] = { points: points[id], games: games[id], ppg: points[id] / games[id] };
  });
  return out;
}

function computeTeamGamesPlayed(matchups) {
  const games = {};
  matchups.forEach(m => {
    games[m.home_team_id] = (games[m.home_team_id] || 0) + 1;
    games[m.away_team_id] = (games[m.away_team_id] || 0) + 1;
  });
  return games;
}

/* Every started player's season totals, per team, unsliced - the base
   this page derives top-3 lists from (overall, by position, or filtered
   to a team's own draft picks) without re-scanning weeklyBoxscores each time. */
function computeTeamPlayerTotals(weeklyBoxscores) {
  const totals = {};
  Object.values(weeklyBoxscores).forEach(week => {
    Object.entries(week).forEach(([teamId, players]) => {
      totals[teamId] ??= {};
      players.forEach(p => {
        if (!p.started) return;
        const entry = totals[teamId][p.player_id] ??= { player_id: p.player_id, name: p.name, position: p.position, points: 0, games: 0 };
        entry.points += p.points || 0;
        entry.games += 1;
      });
    });
  });
  const out = {};
  Object.entries(totals).forEach(([teamId, players]) => {
    out[teamId] = Object.values(players).map(p => ({ ...p, ppg: p.points / p.games }));
  });
  return out;
}

function topN(players, n) {
  return [...players].sort((a, b) => b.points - a.points).slice(0, n);
}

function findMatchup(matchups, week, teamId) {
  return matchups.find(m => m.week === week && (m.home_team_id === teamId || m.away_team_id === teamId));
}

function teamResultInGame(game, teamId) {
  const isHome = game.home_team_id === teamId;
  const won = (isHome && game.winner === 'HOME') || (!isHome && game.winner === 'AWAY');
  const teamScore = isHome ? game.home_score : game.away_score;
  const oppScore = isHome ? game.away_score : game.home_score;
  return { won, teamScore, oppScore };
}

function computeBiggestFlip(weeklyBoxscores, week, teamAId, teamBId) {
  const playersA = (weeklyBoxscores[week]?.[teamAId] || []).filter(p => p.started);
  const playersB = (weeklyBoxscores[week]?.[teamBId] || []).filter(p => p.started);
  const groupByPos = players => {
    const groups = {};
    players.forEach(p => (groups[p.position] ??= []).push(p));
    Object.values(groups).forEach(g => g.sort((a, b) => b.points - a.points));
    return groups;
  };
  const groupsA = groupByPos(playersA), groupsB = groupByPos(playersB);
  let best = null;
  Object.keys(groupsA).forEach(pos => {
    const gA = groupsA[pos], gB = groupsB[pos] || [];
    for (let i = 0; i < Math.min(gA.length, gB.length); i++) {
      const diff = Math.abs(gA[i].points - gB[i].points);
      if (!best || diff > best.diff) best = { position: pos, playerA: gA[i], playerB: gB[i], diff };
    }
  });
  return best;
}

/* Traces the real championship bracket forward, round by round - "real"
   meaning only games where both sides are still unbeaten within the
   bracket, so this naturally excludes the parallel consolation-ladder
   games (same is_playoffs=true weeks, different competition) and the
   placement games among already-eliminated bracket teams (e.g. the
   "3rd place game" - see compute_standings in build_season_moments.py
   for why that's not treated as official here). */
function computePlayoffBracket(matchups, standings, teamsById) {
  const bracketIds = new Set(standings.filter(r => r.status !== 'non_playoff').map(r => r.team_id));
  const playoffWeeks = [...new Set(matchups.filter(m => m.is_playoffs).map(m => m.week))].sort((a, b) => a - b);
  const roundTitle = (i, n) => {
    if (i === n - 1) return 'Final';
    if (n - i === 2) return 'Semifinal';
    if (n - i === 3) return 'Quarterfinal';
    return `Round ${i + 1}`;
  };

  let alive = new Set(bracketIds);
  const rounds = [];
  playoffWeeks.forEach((week, i) => {
    const games = matchups.filter(m => m.is_playoffs && m.week === week && alive.has(m.home_team_id) && alive.has(m.away_team_id));
    const gameTeamIds = new Set(games.flatMap(g => [g.home_team_id, g.away_team_id]));
    const byes = [...alive].filter(id => !gameTeamIds.has(id));
    const slots = games.map(g => ({
      type: 'match',
      teamA: teamsById[g.home_team_id],
      scoreA: g.home_score,
      teamB: teamsById[g.away_team_id],
      scoreB: g.away_score,
      winnerId: g.winner === 'HOME' ? g.home_team_id : g.away_team_id,
    }));
    byes.forEach(id => slots.push({ type: 'bye', team: teamsById[id] }));
    rounds.push({ title: roundTitle(i, playoffWeeks.length), slots });
    games.forEach(g => alive.delete(g.winner === 'HOME' ? g.away_team_id : g.home_team_id));
  });
  return rounds;
}

/* Elimination-round label for playoff-bracket teams. standings rows carry
   eliminated_round as an abstract "rounds before the final" number (see
   compute_standings in build_season_moments.py) - translate the two that
   actually occur in a byes-for-top-seeds bracket into plain language,
   falling back to a round number for anything deeper. */
function roundLabel(eliminatedRound, maxRound) {
  const fromFinal = maxRound - eliminatedRound;
  if (fromFinal === 0) return 'Lost in the Semifinal';
  if (fromFinal === 1) return 'Lost in the Quarterfinal';
  return `Lost in Round ${eliminatedRound}`;
}

/* ---------- rendering ---------- */

function keyPlayersHtml(players) {
  if (!players.length) return '';
  return `<div class="tile-sublist">${players.map(p => `
    <div class="sub-row"><span class="name"><span class="pos-badge pos-${p.position}">${p.position}</span> ${p.name}</span><span class="pts">${ppgHtml(p.ppg, p.points)}</span></div>
  `).join('')}</div>`;
}

function scorerListHtml(teamId, teamTopScorers, extraClass) {
  const players = teamTopScorers[teamId] || [];
  if (!players.length) return '';
  const rows = players.map(p => `
    <div class="scorer-row">
      <span class="scorer-name"><span class="pos-badge pos-${p.position}">${p.position}</span> ${p.name}</span>
      <span class="scorer-pts">${ppgHtml(p.ppg, p.points)}</span>
    </div>
  `).join('');
  return `<div class="scorer-list ${extraClass || ''}"><div class="tile-label">Top Scorers (PPG)</div>${rows}</div>`;
}

function renderBracket(rounds) {
  const seededChip = t => teamChip(t, 'sm', `<span class="bracket-seed">(${t.playoff_seed})</span>`);
  return `
    <div class="bracket">
      ${rounds.map(round => `
        <div class="bracket-round">
          <div class="bracket-round-title">${round.title}</div>
          ${round.slots.map(slot => slot.type === 'bye' ? `
            <div class="bracket-match bracket-bye">
              ${seededChip(slot.team)}
              <div class="bracket-bye-label">Bye</div>
            </div>
          ` : `
            <div class="bracket-match">
              <div class="bracket-team ${slot.winnerId === slot.teamA.id ? 'winner' : ''}">
                ${seededChip(slot.teamA)}<span class="bracket-score">${fmt1(slot.scoreA)}</span>
              </div>
              <div class="bracket-team ${slot.winnerId === slot.teamB.id ? 'winner' : ''}">
                ${seededChip(slot.teamB)}<span class="bracket-score">${fmt1(slot.scoreB)}</span>
              </div>
            </div>
          `).join('')}
        </div>
      `).join('')}
    </div>
  `;
}

function renderTeamRows(rows, teamsById, regularSeasonStats, teamTopScorers, maxEliminatedRound, analyticsById) {
  return `<div class="team-rows">${rows.map(row => {
    const t = teamsById[row.team_id];
    const rs = regularSeasonStats[t.id];
    const an = analyticsById[t.id];
    const apLosses = an.all_play_games - an.all_play_wins;
    const apPct = an.all_play_games ? (an.all_play_wins / an.all_play_games * 100) : 0;
    const apScale = an.all_play_games ? an.all_play_games / rs.games : 1;
    const apWinsScaled = an.all_play_wins / apScale;
    const apLossesScaled = apLosses / apScale;
    let tag = '';
    if (row.status === 'champion') tag = `<div class="round-tag highlight">Champion</div>`;
    else if (row.status === 'runner_up') tag = `<div class="round-tag highlight">Runner-Up</div>`;
    else if (row.status === 'playoff') tag = `<div class="round-tag">${roundLabel(row.eliminated_round, maxEliminatedRound)}</div>`;
    const rankClass = row.status === 'champion' ? ' rank-1' : row.status === 'runner_up' ? ' rank-2' : '';
    return `
    <div class="team-row${rankClass}">
      <div class="team-row-rank">${row.rank}</div>
      <img class="team-logo" src="${teamLogo(t)}" alt="">
      <div>
        <div class="team-row-name">${t.name}</div>
        <div class="team-row-owner">${ownerName(t)}</div>
        ${tag}
      </div>
      <div class="team-row-stats">
        <div class="stat"><div class="stat-value">${t.wins}-${t.losses}</div><div class="stat-label">Record</div></div>
        <div class="stat"><div class="stat-value">${ppgHtml(rs.ppg, t.points_for)}</div><div class="stat-label">Points/Game</div></div>
        <div class="stat"><div class="stat-value">${fmt1(apWinsScaled)}-${fmt1(apLossesScaled)} <span class="stat-sub">(${fmt1(apPct)}%)</span></div><div class="stat-label">All-Play</div></div>
      </div>
      ${scorerListHtml(t.id, teamTopScorers)}
    </div>
  `;
  }).join('')}</div>`;
}

function buildWeeklyArc(matchups, teamAId, teamBId) {
  const byWeek = {};
  matchups.forEach(m => {
    if (m.is_playoffs) return;
    (byWeek[m.week] ??= []).push([m.home_team_id, m.home_score], [m.away_team_id, m.away_score]);
  });
  const weeks = Object.keys(byWeek).map(Number).sort((a, b) => a - b);
  return weeks.map(week => {
    const scores = byWeek[week];
    const avg = scores.reduce((s, [, v]) => s + v, 0) / scores.length;
    const teamA = scores.find(([id]) => id === teamAId)?.[1];
    const teamB = scores.find(([id]) => id === teamBId)?.[1];
    return { week, avg, teamA, teamB };
  });
}

function renderChartSvg(arc, teamA, teamB) {
  const W = 1000, H = 320, padL = 36, padR = 60, padT = 16, padB = 30;
  const allVals = arc.flatMap(d => [d.avg, d.teamA, d.teamB]).filter(v => v != null);
  const minV = Math.floor(Math.min(...allVals) / 10) * 10 - 5;
  const maxV = Math.ceil(Math.max(...allVals) / 10) * 10 + 5;
  const x = i => padL + (i / (arc.length - 1)) * (W - padL - padR);
  const y = v => H - padB - ((v - minV) / (maxV - minV)) * (H - padT - padB);
  const line = key => arc.map((d, i) => `${x(i)},${y(d[key])}`).join(' ');

  const gridVals = [minV, (minV + maxV) / 2, maxV];
  const gridlines = gridVals.map(v => `
    <line class="gridline" x1="${padL}" x2="${W - padR}" y1="${y(v)}" y2="${y(v)}" />
    <text class="axis-label" x="4" y="${y(v) + 3}">${Math.round(v)}</text>
  `).join('');

  const xTicks = arc.map((d, i) => (i % 2 === 0 || i === arc.length - 1)
    ? `<text class="axis-label" x="${x(i)}" y="${H - 8}" text-anchor="middle">W${d.week}</text>` : '').join('');

  const dots = (key, color) => arc.map((d, i) => `<circle class="end-dot" cx="${x(i)}" cy="${y(d[key])}" r="4" fill="${color}"><title>${fmt1(d[key])} pts - Week ${d.week}</title></circle>`).join('');

  const lastI = arc.length - 1;
  const colorA = 'var(--brand)', colorB = 'var(--cat-1)';

  return `
    <div class="chart-legend">
      <div class="chart-legend-item"><span class="swatch" style="background:${colorA}"></span>${teamChip(teamA, 'xs')}</div>
      <div class="chart-legend-item"><span class="swatch" style="background:${colorB}"></span>${teamChip(teamB, 'xs')}</div>
      <div class="chart-legend-item"><span class="swatch" style="background:var(--text-mute)"></span>League average</div>
    </div>
    <svg class="chart-svg" viewBox="0 0 ${W} ${H}">
      ${gridlines}
      ${xTicks}
      <polyline class="avg-line" points="${line('avg')}" />
      <polyline class="series-line" points="${line('teamA')}" stroke="${colorA}" />
      <polyline class="series-line" points="${line('teamB')}" stroke="${colorB}" />
      ${dots('teamA', colorA)}
      ${dots('teamB', colorB)}
      <text class="end-label" x="${x(lastI) + 8}" y="${y(arc[lastI].teamA) + 4}" fill="${colorA}">${teamA.abbrev}</text>
      <text class="end-label" x="${x(lastI) + 8}" y="${y(arc[lastI].teamB) + 4}" fill="${colorB}">${teamB.abbrev}</text>
    </svg>
  `;
}

function renderChartSection(matchups, teamsById, orderedTeams, teamAId, teamBId) {
  const options = orderedTeams.map(t => `<option value="${t.id}">${t.name}</option>`).join('');
  const arc = buildWeeklyArc(matchups, teamAId, teamBId);
  return `
    <div class="chart-controls">
      <label>Team A <select id="chart-team-a">${options}</select></label>
      <label>Team B <select id="chart-team-b">${options}</select></label>
    </div>
    <div id="chart-render">${renderChartSvg(arc, teamsById[teamAId], teamsById[teamBId])}</div>
  `;
}

function wireChartControls(matchups, teamsById, champId, ruId) {
  const selA = document.getElementById('chart-team-a');
  const selB = document.getElementById('chart-team-b');
  selA.value = champId;
  selB.value = ruId;
  const rerender = () => {
    const teamAId = Number(selA.value), teamBId = Number(selB.value);
    const arc = buildWeeklyArc(matchups, teamAId, teamBId);
    document.getElementById('chart-render').innerHTML = renderChartSvg(arc, teamsById[teamAId], teamsById[teamBId]);
  };
  selA.addEventListener('change', rerender);
  selB.addEventListener('change', rerender);
}

function renderTopPerformances(moments, teamsById, weeklyBoxscores) {
  const teamWeeks = moments.weekly_team_extremes.best_weeks.slice(0, 5).map(w => {
    const topScorers = (weeklyBoxscores[w.week]?.[w.team_id] || []).filter(p => p.started).sort((a, b) => b.points - a.points).slice(0, 3);
    const scorersHtml = topScorers.length ? `
      <div class="rank-detail-full">
        <div class="mini-scorers">
          ${topScorers.map(p => `<span class="mini-scorer"><span class="pos-badge pos-${p.position}">${p.position}</span> ${p.name} <b>${fmt1(p.points)}</b></span>`).join('')}
        </div>
      </div>
    ` : '';
    return `
    <li>
      <div class="rank-main">
        <div class="rank-chip-row">${teamChip(teamsById[w.team_id], 'sm')}</div>
        <div class="rank-sub">Week ${w.week}${w.is_playoffs ? ' (playoffs)' : ''}</div>
      </div>
      <div class="rank-value">${fmt1(w.score)}</div>
      ${scorersHtml}
    </li>
  `;
  }).join('');

  const playerWeeks = moments.player_extremes.best_performances.slice(0, 5).map(p => {
    const nflHtml = p.pro_opponent ? `
      <div class="rank-detail-full">
        <span class="nfl-detail">${p.pro_team} ${p.pro_home ? 'vs' : '@'} ${p.pro_opponent} &middot; Final ${Math.round(p.pro_team_score)}-${Math.round(p.pro_opponent_score)}</span>
        ${p.stat_line ? `<span class="nfl-detail">&middot; ${p.stat_line}</span>` : ''}
      </div>
    ` : '';
    return `
    <li>
      <div class="rank-main">
        <span class="pos-badge pos-${p.position}">${p.position}</span> ${p.name}
        <div class="rank-chip-row">${teamChip(teamsById[p.team_id], 'xs', null, `<span class="rank-sub">&middot; Week ${p.week}</span>`)}</div>
      </div>
      <div class="rank-value">${fmt1(p.points)}</div>
      ${nflHtml}
    </li>
  `;
  }).join('');

  return `
    <div class="tile-grid" style="grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));">
      <div class="card">
        <div class="section-title">Top Team Weeks</div>
        <ul class="rank-list">${teamWeeks}</ul>
      </div>
      <div class="card">
        <div class="section-title">Top Player Weeks</div>
        <ul class="rank-list">${playerWeeks}</ul>
      </div>
    </div>
  `;
}

function positionHeavyTile(teamAnalytics, teamsById, teamGamesPlayed, playerTotals, pos, label) {
  const sorted = [...teamAnalytics].sort((a, b) => (b.started_points_pct_by_position[pos] || 0) - (a.started_points_pct_by_position[pos] || 0));
  const top = sorted[0];
  const pts = top.started_points_by_position[pos] || 0;
  const games = teamGamesPlayed[top.team_id] || 1;
  const keyPlayers = topN((playerTotals[top.team_id] || []).filter(p => p.position === pos), 3);
  return {
    label,
    headlineTeam: teamsById[top.team_id],
    detail: `${ppgHtml(pts / games, pts, 'PPG')} from the ${pos} spot`,
    value: `${top.started_points_pct_by_position[pos]}% of offense`,
    sub: keyPlayersHtml(keyPlayers),
  };
}

/* Highest share of a team's offense credited to one acquisition source
   (draft/trade/pickup) - a composition question ("how much of your team
   came from here"), distinct from Best/Worst Draft (a production
   question, "how many points did your draft picks score"). Key players
   are the team's overall top scorers (points scored for that team), not
   filtered to just that source. */
const SOURCE_DETAIL_LABEL = { DRAFT: 'draft picks', TRADE: 'traded-in players', PICKUP: 'waiver/free-agent pickups' };

function sourceHeavyTile(teamAnalytics, teamsById, teamGamesPlayed, source, label) {
  const sorted = [...teamAnalytics].sort((a, b) => (b.started_points_pct_by_source[source] || 0) - (a.started_points_pct_by_source[source] || 0));
  const top = sorted[0];
  const pts = top.started_points_by_source[source] || 0;
  const games = teamGamesPlayed[top.team_id] || 1;
  const keyPlayers = top.top_players_by_source?.[source] || [];
  return {
    label,
    headlineTeam: teamsById[top.team_id],
    detail: `${ppgHtml(pts / games, pts, 'PPG')} from ${SOURCE_DETAIL_LABEL[source]}`,
    value: `${top.started_points_pct_by_source[source] || 0}% of offense`,
    sub: keyPlayersHtml(keyPlayers),
  };
}

function renderSuperlatives(moments, teamsById, matchups, weeklyBoxscores, teamAnalytics, teamGamesPlayed, playerTotals, draftedSet) {
  const upset = moments.upsets[0];
  const bestWeek = moments.weekly_team_extremes.best_weeks[0];
  const pickup = moments.best_waiver_pickups[0];
  const benched = moments.bench_mistakes.worst_single_instances[0];
  const closest = [...moments.rivalries].sort((a, b) => a.avg_margin - b.avg_margin)[0];
  const wounded = moments.injury_burden[0];

  // Best trade: biggest single-side point differential.
  let bestTrade = null, bestDiff = -1;
  moments.trades.forEach(t => {
    if (t.sides.length !== 2) return;
    const diff = Math.abs(t.sides[0].total_points - t.sides[1].total_points);
    if (diff > bestDiff) {
      bestDiff = diff;
      const [winner, loser] = t.sides[0].total_points >= t.sides[1].total_points ? t.sides : [t.sides[1], t.sides[0]];
      bestTrade = { winner, loser, week: t.week };
    }
  });

  // Biggest Upset: full records for context.
  const winnerTeam = teamsById[upset.winner_team_id], loserTeam = teamsById[upset.loser_team_id];
  const upsetSub = `
    <div class="tile-sublist">
      <div class="sub-row"><span class="name">${winnerTeam.name} (${winnerTeam.wins}-${winnerTeam.losses}, finished #${upset.winner_final_rank})</span></div>
      <div class="sub-row"><span class="name">${loserTeam.name} (${loserTeam.wins}-${loserTeam.losses}, finished #${upset.loser_final_rank})</span></div>
    </div>
  `;

  // Best Team Week: top 3 players that game.
  const weekBox = (weeklyBoxscores[bestWeek.week]?.[bestWeek.team_id] || []).filter(p => p.started).sort((a, b) => b.points - a.points).slice(0, 3);
  const bestWeekSub = `
    <div class="tile-sublist">
      ${weekBox.map(p => `<div class="sub-row"><span class="name"><span class="pos-badge pos-${p.position}">${p.position}</span> ${p.name}</span><span class="pts">${fmt1(p.points)}</span></div>`).join('')}
    </div>
  `;

  // Worst Bench Mistake: did the team win or lose that week anyway, and
  // against whom - shown as its own line below "Bench of", not crammed
  // into the detail text.
  const benchGame = findMatchup(matchups, benched.week, benched.team_id);
  const benchResult = benchGame ? teamResultInGame(benchGame, benched.team_id) : null;
  const benchOppId = benchGame ? (benchGame.home_team_id === benched.team_id ? benchGame.away_team_id : benchGame.home_team_id) : null;
  const benchResultSub = benchResult && benchOppId ? `
    <div class="tile-team-byline" style="margin-top:8px">
      <span class="byline-label">${benchResult.won ? 'Beat' : 'Lost to'}</span>
      ${teamChip(teamsById[benchOppId], 'sm')}
      <span class="bracket-score" style="margin-left:auto">${fmt1(benchResult.teamScore)}-${fmt1(benchResult.oppScore)}</span>
    </div>
  ` : '';

  // Closest Game: full score (in the same team order as the matchup block,
  // not raw home/away order - those don't necessarily match) + biggest
  // position-matchup flip.
  const closestTeamA = teamsById[closest.team_ids[0]], closestTeamB = teamsById[closest.team_ids[1]];
  const closestGame = findMatchup(matchups, closest.games[0].week, closest.team_ids[0]);
  const closestScoreA = closestGame ? teamResultInGame(closestGame, closest.team_ids[0]).teamScore : null;
  const closestScoreB = closestGame ? teamResultInGame(closestGame, closest.team_ids[1]).teamScore : null;
  const flip = computeBiggestFlip(weeklyBoxscores, String(closest.games[0].week), String(closest.team_ids[0]), String(closest.team_ids[1]));
  const flipHtml = flip ? `
    <div class="flip-matchup">
      <div class="flip-pos">Biggest Swing &middot; ${flip.position}</div>
      <div class="flip-row ${flip.playerA.points >= flip.playerB.points ? 'flip-winner' : ''}"><span>${flip.playerA.name}</span><span class="flip-pts">${fmt1(flip.playerA.points)}</span></div>
      <div class="flip-row ${flip.playerB.points > flip.playerA.points ? 'flip-winner' : ''}"><span>${flip.playerB.name}</span><span class="flip-pts">${fmt1(flip.playerB.points)}</span></div>
    </div>
  ` : '';

  // Walking Wounded: actual player names.
  const woundedSub = `
    <div class="tile-sublist">
      <div class="sub-row"><span class="name">${wounded.distinct_players_on_ir.join(', ')}</span></div>
    </div>
  `;

  // Draft quality: raw points started this season from players still
  // attributed to their original draft slot (never re-acquired via waiver/trade).
  const draftSorted = [...teamAnalytics].sort((a, b) => (b.started_points_by_source.DRAFT || 0) - (a.started_points_by_source.DRAFT || 0));
  const bestDraft = draftSorted[0], worstDraft = draftSorted[draftSorted.length - 1];
  const bestDraftGames = teamGamesPlayed[bestDraft.team_id] || 1;
  const worstDraftGames = teamGamesPlayed[worstDraft.team_id] || 1;
  const draftedPlayers = (teamId) => (playerTotals[teamId] || []).filter(p => draftedSet.has(`${teamId}_${p.player_id}`));
  const bestDraftKeyPlayers = topN(draftedPlayers(bestDraft.team_id), 3);
  const worstDraftKeyPlayers = topN(draftedPlayers(worstDraft.team_id), 3);

  // Luckiest/Unluckiest: biggest gap between actual wins and all-play
  // "expected" wins - positive luck_index means they won more games than
  // their weekly scoring rank alone would predict.
  const lucky = [...teamAnalytics].sort((a, b) => b.luck_index - a.luck_index)[0];
  const luckyWeeksNote = lucky.good_luck_win_weeks.length
    ? ` &middot; finished bottom 3 in scoring and still won in Week ${lucky.good_luck_win_weeks.join(', ')}`
    : '';
  const unlucky = [...teamAnalytics].sort((a, b) => a.luck_index - b.luck_index)[0];
  const unluckyWeeksNote = unlucky.bad_luck_loss_weeks.length
    ? ` &middot; finished top 3 in scoring and still lost in Week ${unlucky.bad_luck_loss_weeks.join(', ')}`
    : '';

  const tiles = [
    {
      label: 'Biggest Upset',
      matchup: matchupHtml(winnerTeam, loserTeam, 'beat'),
      detail: `Week ${upset.week}`,
      value: `${fmt1(upset.winner_score)} - ${fmt1(upset.loser_score)}`,
      sub: upsetSub,
    },
    {
      label: 'Best Team Week',
      headlineTeam: teamsById[bestWeek.team_id],
      detail: `Week ${bestWeek.week}${bestWeek.is_playoffs ? ' &middot; playoffs' : ''}`,
      value: fmt1(bestWeek.score),
      sub: bestWeekSub,
    },
    {
      label: 'Best Waiver Add',
      headline: `${pickup.name} (${pickup.position})`,
      detail: `Week ${pickup.week_added} &middot; ${pickup.games_started} games started`,
      value: ppgHtml(pickup.points_per_game, pickup.points_while_rostered, 'PPG'),
      teamByline: { label: 'Picked up by', team: teamsById[pickup.team_id] },
    },
    {
      label: 'Best Trade',
      headline: `Week ${bestTrade.week} trade`,
      detail: `Won it by ${fmt1(bestDiff)} pts`,
      value: `${fmt1(bestTrade.winner.total_points)} vs ${fmt1(bestTrade.loser.total_points)}`,
      sub: `
        <div class="trade-sides">
          <div class="trade-side">
            <div class="tile-team-byline">${teamChip(teamsById[bestTrade.winner.team_id], 'sm')}<span class="byline-label">received</span></div>
            ${bestTrade.winner.players_received.map(p => `<div class="sub-row"><span class="name">${p.name} (${p.position})</span><span class="pts">${ppgHtml(p.points_per_game, p.points_while_rostered)}</span></div>`).join('')}
          </div>
          <div class="trade-side">
            <div class="tile-team-byline">${teamChip(teamsById[bestTrade.loser.team_id], 'sm')}<span class="byline-label">received</span></div>
            ${bestTrade.loser.players_received.map(p => `<div class="sub-row"><span class="name">${p.name} (${p.position})</span><span class="pts">${ppgHtml(p.points_per_game, p.points_while_rostered)}</span></div>`).join('')}
          </div>
        </div>
      `,
    },
    {
      label: 'Worst Bench Mistake',
      headline: `${benched.name} (${benched.position}) left on the bench`,
      detail: `Week ${benched.week}`,
      value: `${fmt1(benched.points)} pts unused`,
      teamByline: { label: 'Bench of', team: teamsById[benched.team_id] },
      sub: benchResultSub,
    },
    {
      label: 'Closest Game',
      matchup: matchupHtml(closestTeamA, closestTeamB, 'vs'),
      detail: `Week ${closest.games[0].week}`,
      value: closestGame ? `${fmt1(closestScoreA)} - ${fmt1(closestScoreB)}` : `${closest.avg_margin.toFixed(2)} pt margin`,
      sub: flipHtml,
    },
    {
      label: 'Walking Wounded',
      headlineTeam: teamsById[wounded.team_id],
      detail: `${wounded.distinct_players_on_ir.length} different players on IR over the season`,
      value: `${wounded.player_weeks_on_ir} player-weeks lost`,
      sub: woundedSub,
    },
    {
      label: 'Best Draft',
      headlineTeam: teamsById[bestDraft.team_id],
      detail: `${ppgHtml((bestDraft.started_points_by_source.DRAFT || 0) / bestDraftGames, bestDraft.started_points_by_source.DRAFT || 0, 'PPG')} from draft picks still on the roster`,
      value: `${bestDraft.started_points_pct_by_source.DRAFT}% of offense`,
      sub: keyPlayersHtml(bestDraftKeyPlayers),
    },
    {
      label: 'Worst Draft',
      headlineTeam: teamsById[worstDraft.team_id],
      detail: `Just ${ppgHtml((worstDraft.started_points_by_source.DRAFT || 0) / worstDraftGames, worstDraft.started_points_by_source.DRAFT || 0, 'PPG')} from draft picks - the rest was rebuilt off the wire`,
      value: `${worstDraft.started_points_pct_by_source.DRAFT || 0}% of offense`,
      sub: keyPlayersHtml(worstDraftKeyPlayers),
    },
    sourceHeavyTile(teamAnalytics, teamsById, teamGamesPlayed, 'DRAFT', 'Draft Heavy'),
    sourceHeavyTile(teamAnalytics, teamsById, teamGamesPlayed, 'TRADE', 'Trade Heavy'),
    sourceHeavyTile(teamAnalytics, teamsById, teamGamesPlayed, 'PICKUP', 'Pickup Heavy'),
    positionHeavyTile(teamAnalytics, teamsById, teamGamesPlayed, playerTotals, 'QB', 'QB Heavy'),
    positionHeavyTile(teamAnalytics, teamsById, teamGamesPlayed, playerTotals, 'RB', 'RB Heavy'),
    positionHeavyTile(teamAnalytics, teamsById, teamGamesPlayed, playerTotals, 'WR', 'WR Heavy'),
    positionHeavyTile(teamAnalytics, teamsById, teamGamesPlayed, playerTotals, 'D/ST', 'D/ST Heavy'),
    {
      label: 'Luckiest Team',
      headlineTeam: teamsById[lucky.team_id],
      detail: `Expected ~${fmt1(lucky.expected_wins)} wins off weekly scoring rank (all-play ${lucky.all_play_wins}-${lucky.all_play_games - lucky.all_play_wins}), finished with ${lucky.actual_wins}${luckyWeeksNote}`,
      value: `+${fmt1(lucky.luck_index)} wins`,
    },
    {
      label: 'Unluckiest Team',
      headlineTeam: teamsById[unlucky.team_id],
      detail: `Expected ~${fmt1(unlucky.expected_wins)} wins off weekly scoring rank (all-play ${unlucky.all_play_wins}-${unlucky.all_play_games - unlucky.all_play_wins}), finished with ${unlucky.actual_wins}${unluckyWeeksNote}`,
      value: `${fmt1(unlucky.luck_index)} wins`,
    },
  ];

  return `
    <div class="tile-grid" style="grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));">
      ${tiles.map(t => `
        <div class="tile">
          <div class="tile-label">${t.label}</div>
          ${t.headlineTeam ? teamChip(t.headlineTeam) : ''}
          ${t.matchup || ''}
          ${t.headline ? `<div class="tile-headline">${t.headline}</div>` : ''}
          <div class="tile-detail">${t.detail}</div>
          <div class="tile-value">${t.value}</div>
          ${t.teamByline ? `<div class="tile-team-byline"><span class="byline-label">${t.teamByline.label}</span>${teamChip(t.teamByline.team, 'sm')}</div>` : ''}
          ${t.sub || ''}
        </div>
      `).join('')}
    </div>
  `;
}

async function loadApp() {
  document.getElementById('lock-screen').style.display = 'none';
  document.getElementById('app').style.display = '';

  const meta = await (await fetch('data/meta.json')).json();
  const resources = [
    { label: 'League Rules', href: 'https://docs.google.com/document/d/1q_smocauuxIDkYcAw6Cirj2t5gmFihMDPqs6NPtdfZI/edit?tab=t.0', external: true },
    { label: 'Keeper Dossier', href: 'index.html', external: false },
    { label: 'ADP Rankings', href: 'adp.html', external: false },
    { label: 'ESPN League Home', href: `https://fantasy.espn.com/football/league?leagueId=${meta.league_id}`, external: true },
  ];
  document.getElementById('resources-nav').innerHTML = resources
    .map(r => `<a href="${r.href}"${r.external ? ' target="_blank" rel="noopener"' : ''}>${r.label}</a>`)
    .join('');

  const [teams, moments, matchups, weeklyBoxscores, teamAnalytics, draftPicks] = await Promise.all([
    fetch(`data/${SEASON}/teams.json`).then(r => r.json()),
    fetch(`data/${SEASON}/season_moments.json`).then(r => r.json()),
    fetch(`data/${SEASON}/matchups.json`).then(r => r.json()),
    fetch(`data/${SEASON}/weekly_boxscores.json`).then(r => r.json()),
    fetch(`data/${SEASON}/team_analytics.json`).then(r => r.json()),
    fetch(`data/${SEASON}/draft.json`).then(r => r.json()),
  ]);

  const teamsById = Object.fromEntries(teams.map(t => [t.id, t]));
  const draftedSet = new Set(draftPicks.map(p => `${p.team_id}_${p.player_id}`));

  // Standings order comes from moments.standings, NOT teams.json's
  // final_rank - that's ESPN's own placement-game-based ranking, which
  // this league doesn't treat as official. See compute_standings in
  // build_season_moments.py for the real rule (playoff teams ranked by
  // order eliminated, everyone else by regular-season record/PF).
  const standings = moments.standings;
  const champRow = standings.find(r => r.status === 'champion');
  const ruRow = standings.find(r => r.status === 'runner_up');
  const champ = teamsById[champRow.team_id], ru = teamsById[ruRow.team_id];
  const maxEliminatedRound = Math.max(...standings.filter(r => r.eliminated_round != null).map(r => r.eliminated_round));
  const orderedTeams = standings.map(r => teamsById[r.team_id]);

  const regularSeasonStats = computeRegularSeasonStats(matchups);
  const teamGamesPlayed = computeTeamGamesPlayed(matchups);
  const playerTotals = computeTeamPlayerTotals(weeklyBoxscores);
  const teamTopScorers = Object.fromEntries(Object.entries(playerTotals).map(([id, players]) => [id, topN(players, 3)]));
  const bracketRounds = computePlayoffBracket(matchups, standings, teamsById);
  const analyticsById = Object.fromEntries(teamAnalytics.map(a => [a.team_id, a]));

  document.getElementById('content').innerHTML = `
    <div class="section">
      <div class="section-title">Final Standings</div>
      ${renderTeamRows(standings, teamsById, regularSeasonStats, teamTopScorers, maxEliminatedRound, analyticsById)}
    </div>

    <div class="section">
      <div class="section-title">Playoff Bracket</div>
      <div class="card">${renderBracket(bracketRounds)}</div>
    </div>

    <div class="section">
      <div class="section-title">Season Arc &mdash; Head to Head</div>
      <div class="card">${renderChartSection(matchups, teamsById, orderedTeams, champ.id, ru.id)}</div>
    </div>

    <div class="section">
      <div class="section-title">Top Performances</div>
      ${renderTopPerformances(moments, teamsById, weeklyBoxscores)}
    </div>

    <div class="section">
      <div class="section-title">Superlatives</div>
      ${renderSuperlatives(moments, teamsById, matchups, weeklyBoxscores, teamAnalytics, teamGamesPlayed, playerTotals, draftedSet)}
    </div>
  `;

  wireChartControls(matchups, teamsById, champ.id, ru.id);
}

document.getElementById('auth-form').addEventListener('submit', (e) => {
  e.preventDefault();
  const input = document.getElementById('auth-input');
  if (input.value === PASSWORD) {
    localStorage.setItem('jsi_auth', 'granted');
    loadApp();
  } else {
    document.getElementById('auth-error').classList.add('show');
    input.value = '';
  }
});

if (localStorage.getItem('jsi_auth') === 'granted') {
  loadApp();
}

function updateThemeToggleIcon() {
  const isLight = document.documentElement.getAttribute('data-theme') === 'light';
  document.getElementById('theme-toggle').textContent = isLight ? '\u{1F319}' : '\u{2600}\u{FE0F}';
}
document.getElementById('theme-toggle').addEventListener('click', () => {
  const isLight = document.documentElement.getAttribute('data-theme') === 'light';
  if (isLight) {
    document.documentElement.removeAttribute('data-theme');
    localStorage.setItem('jsi_theme', 'dark');
  } else {
    document.documentElement.setAttribute('data-theme', 'light');
    localStorage.setItem('jsi_theme', 'light');
  }
  updateThemeToggleIcon();
});
updateThemeToggleIcon();
</script>
